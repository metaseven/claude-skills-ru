# Сборка сайта и публикация на GitHub Pages при каждом push в main.
# LLM здесь не вызывается: переводы уже лежат в data/skills/.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      # Клонируем источники заново только ради zip-архивов (meta.json берём из репозитория,
      # поэтому sync не перезаписывает его: скилы, изменившиеся после перевода, упакуются в новой версии).
      - name: Fetch sources for zip archives
        run: |
          node -e '
            const { execFileSync } = require("child_process");
            for (const s of require("./data/sources.json"))
              execFileSync("git", ["clone", "--depth", "1", "--branch", s.branch,
                `https://github.com/${s.repo}.git`, `.cache/sources/${s.id}`], { stdio: "inherit" });
          '
      - run: npm run zips
      - run: npm run validate
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
